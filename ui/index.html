<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Static File Server</title>
<style>
:root{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#e8e8eb;background:#111113}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px;background:radial-gradient(circle at 15% 0,#25252d 0,transparent 38%),#111113}.shell{max-width:1050px;margin:auto}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.title{font:700 23px Georgia,serif}.sub{color:#aaaab4;font:14px system-ui,sans-serif}.grid{display:grid;grid-template-columns:1fr;gap:14px 18px}.field{display:grid;grid-template-columns:180px minmax(0,1fr);align-items:center;gap:12px}.field label{font:13px system-ui,sans-serif;color:#b8b8c0;text-align:right}.field input,.field select{width:100%;padding:10px 12px;border:1px solid #4a4a56;border-radius:4px;background:#23232b;color:#eee;font:14px ui-monospace}.field input[type="checkbox"]{width:20px;height:20px;justify-self:start;accent-color:#1687c2}.field label{text-align:right}.actions{display:flex;gap:10px;margin-top:22px}button{border:0;border-radius:4px;padding:11px 22px;color:#fff;background:#1687c2;font-weight:700;cursor:pointer}button.stop{background:#4a4a54}button:disabled{opacity:.5}.status{margin-top:18px;padding:12px;background:#1a1a20;border-left:3px solid #1687c2;color:#c7c7cf;min-height:42px;font:13px ui-monospace}.hint{color:#858590;font:12px system-ui,sans-serif}@media(max-width:700px){.field,.field label{text-align:left}.top{display:block}.sub{margin-top:8px}}
</style></head><body><main class="shell"><header class="top"><div class="title">Static File Server <span id="connectionName"></span></div><div class="sub">A simple local file server to serve static files from your computer.</div></header><section class="grid">
<div class="field"><label>host</label><input id="host" value="127.0.0.1"></div><div class="field"><label>port</label><input id="port" type="number" value="3456"></div>
<div class="field"><label>directory</label><input id="directory" placeholder="/Users/your-name"></div><div class="field"><label>maxAge</label><input id="maxAge" type="number" value="31536000000"></div>
<div class="field"><label>cacheControl</label><input id="cacheControl" type="checkbox" checked></div><div class="field"><label>lastModified</label><input id="lastModified" type="checkbox" checked></div>
<div class="field"><label>etag</label><input id="etag" type="checkbox" checked></div><div class="field"><label>index</label><input id="index" value="index.html"></div>
<div class="field"><label>redirect</label><input id="redirect" type="checkbox" checked></div><div class="field"><label>dotfiles</label><select id="dotfiles"><option>allow</option><option>deny</option><option>ignore</option></select></div>
<div class="field"><label>acceptRanges</label><input id="acceptRanges" type="checkbox" checked></div><div class="field"><label>backgroundRun</label><input id="backgroundRun" type="checkbox"></div>
</section><div class="actions"><button id="run" type="button">运行</button><button id="stop" class="stop" type="button">停止</button></div><div id="status" class="status">等待 DBX 插件主机连接…</div><p class="hint">配置修改后点击运行将自动重启服务器。</p></main><script>
document.addEventListener("DOMContentLoaded",()=>{
const ids=['host','port','directory','maxAge','cacheControl','lastModified','etag','index','redirect','dotfiles','acceptRanges','backgroundRun'];const el=id=>document.getElementById(id);function config(){const c={};ids.forEach(id=>c[id]=el(id).type==='checkbox'?el(id).checked:el(id).type==='number'?Number(el(id).value):el(id).value);return c}function show(x){el('status').textContent=typeof x==='string'?x:JSON.stringify(x)}async function invoke(method){if(!window.dbxPlugin)throw Error('DBX Host Bridge unavailable');return window.dbxPlugin.invoke(method,{config:config(),connectionId:window.dbxPlugin.context?.connectionId})}el('run').onclick=async()=>{el('run').disabled=true;try{show(await invoke('static-file-server/start'))}catch(e){show('错误: '+e.message)}finally{el('run').disabled=false}};el('stop').onclick=async()=>{try{show(await invoke('static-file-server/stop'))}catch(e){show('错误: '+e.message)}};function connectionId(){const c=window.dbxPlugin?.context||{};return c.connectionId||c.connection_id||c.connection?.id||window.dbxPlugin?.connectionId}async function loadSavedConfig(){const ctx=window.dbxPlugin?.context||{};const id=connectionId();try{const embedded=ctx.config||ctx.connection?.config||ctx.connection?.values||ctx.values||{};const r=id?await window.dbxPlugin.invoke('static-file-server/config',{connectionId:id,config:embedded}):{};const c={...embedded,...(r?.config||{})};if(c.display_name)document.getElementById('connectionName').textContent=' · '+c.display_name;ids.forEach(k=>{if(c[k]===undefined)return;const node=el(k);if(!node)return;if(node.type==='checkbox')node.checked=Boolean(c[k]);else node.value=String(c[k])})}catch(e){show('配置加载失败: '+e.message)}}if(window.dbxPlugin?.ready)window.dbxPlugin.ready.then(async()=>{await loadSavedConfig();window.dbxPlugin.onContext?.(()=>loadSavedConfig());show('已连接 DBX Host，服务器未运行')}).catch(e=>show('DBX Host 未就绪: '+e.message)); else show('DBX Host Bridge unavailable');
});
</script></body></html>
